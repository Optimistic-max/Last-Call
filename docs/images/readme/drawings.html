<!doctype html>
<!-- The five README pictures, drawn in code (SVG) so the team can change them without an image tool.
     Open this file in a browser: #1 to #5 picks the picture (for example drawings.html#3). Each one is
     1600 by 900. The PNGs next to this file are screenshots of these drawings.
     The look follows docs/images/readme/PROMPTS.md: white paper, wobbly black pen lines, a few hand-written
     labels in orange (the main flow), red (the key result) and blue (a side note), and the small black
     creature Xiaohei doing the main action. Xiaohei comes from Ian's Ian Xiaohei Illustrations (MIT); the
     README credits it. Every name and amount in the pictures is made up. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>README drawings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; background: #fff; }
  svg { display: block; width: 1600px; height: 900px; }
  text { font-family: "Caveat", "Segoe Print", cursive; font-weight: 600; }
</style>
</head>
<body>
<svg id="art" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
// ---------- A small pen: every line wobbles a little, the same way each time (a fixed seed) ----------

const INK = "#151515";
const ORANGE = "#E8590C";
const RED = "#D62828";
const BLUE = "#1F6FD1";
const SVG_NS = "http://www.w3.org/2000/svg";
const art = document.getElementById("art");
let random = seeded(1);

// A random number generator that gives the same numbers for the same seed, so a drawing never changes
// between two renders.
function seeded(seed) {
  return function () {
    seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function jitter(amount) {
  return (random() - 0.5) * 2 * amount;
}

// Add an SVG element with these attributes to the drawing.
function add(tag, attributes, parent) {
  const element = document.createElementNS(SVG_NS, tag);
  for (const name in attributes) {
    element.setAttribute(name, attributes[name]);
  }
  (parent || art).appendChild(element);
  return element;
}

// Split each straight stretch into short pieces and nudge the inner points, like a hand that isn't a ruler.
function wobble(points, amount, step) {
  const out = [];
  for (let i = 0; i < points.length - 1; i += 1) {
    const [ax, ay] = points[i];
    const [bx, by] = points[i + 1];
    const pieces = Math.max(1, Math.round(Math.hypot(bx - ax, by - ay) / step));
    for (let k = 0; k < pieces; k += 1) {
      const t = k / pieces;
      out.push([ax + (bx - ax) * t + (k ? jitter(amount) : 0), ay + (by - ay) * t + (k ? jitter(amount) : 0)]);
    }
  }
  out.push(points[points.length - 1]);
  return out;
}

// A smooth curve through the points (Catmull-Rom turned into Bezier curves).
function curve(points, closed) {
  const p = closed ? [points[points.length - 1], ...points, points[0], points[1]] : [points[0], ...points, points[points.length - 1]];
  let d = "M" + p[1][0].toFixed(1) + "," + p[1][1].toFixed(1);
  for (let i = 1; i < p.length - 2; i += 1) {
    const [x0, y0] = p[i - 1], [x1, y1] = p[i], [x2, y2] = p[i + 1], [x3, y3] = p[i + 2];
    d += " C" + (x1 + (x2 - x0) / 6).toFixed(1) + "," + (y1 + (y2 - y0) / 6).toFixed(1) + " " +
      (x2 - (x3 - x1) / 6).toFixed(1) + "," + (y2 - (y3 - y1) / 6).toFixed(1) + " " + x2.toFixed(1) + "," + y2.toFixed(1);
  }
  return closed ? d + " Z" : d;
}

// An open pen line through points.
function line(points, options) {
  const o = Object.assign({ color: INK, width: 3.4, wobble: 1.6, step: 36, dash: null, fill: "none" }, options);
  const attributes = { d: curve(wobble(points, o.wobble, o.step), false), fill: "none", stroke: o.color,
    "stroke-width": o.width, "stroke-linecap": "round", "stroke-linejoin": "round" };
  if (o.dash) attributes["stroke-dasharray"] = o.dash;
  return add("path", attributes, o.parent);
}

// A closed pen shape through points.
function shape(points, options) {
  const o = Object.assign({ color: INK, width: 3.4, wobble: 1.6, step: 36, fill: "none" }, options);
  const loop = wobble([...points, points[0]], o.wobble, o.step);
  loop.pop();
  return add("path", { d: curve(loop, true), fill: o.fill, stroke: o.color, "stroke-width": o.width,
    "stroke-linejoin": "round" }, o.parent);
}

function box(x, y, w, h, options) {
  return shape([[x, y], [x + w, y], [x + w, y + h], [x, y + h]], options);
}

function oval(cx, cy, rx, ry, options) {
  const o = Object.assign({ bumps: 0.04 }, options);
  const points = [];
  for (let i = 0; i < 20; i += 1) {
    const a = (i / 20) * Math.PI * 2;
    const r = 1 + jitter(o.bumps);
    points.push([cx + Math.cos(a) * rx * r, cy + Math.sin(a) * ry * r]);
  }
  return shape(points, Object.assign({ wobble: 0.6, step: 400 }, o));
}

// Hand-written words.
function words(text, x, y, options) {
  const o = Object.assign({ color: INK, size: 40, turn: 0, anchor: "middle", weight: 600 }, options);
  const element = add("text", { x, y, fill: o.color, "font-size": o.size, "text-anchor": o.anchor, "font-weight": o.weight,
    transform: "rotate(" + o.turn + " " + x + " " + y + ")" }, o.parent);
  element.textContent = text;
  return element;
}

// A pen arrow along points, with a little V at the end.
function arrow(points, options) {
  const o = Object.assign({ color: ORANGE, width: 3.4, dash: null }, options);
  line(points, o);
  const [ax, ay] = points[points.length - 2];
  const [bx, by] = points[points.length - 1];
  const angle = Math.atan2(by - ay, bx - ax);
  const head = 18;
  for (const side of [-0.45, 0.45]) {
    line([[bx, by], [bx - Math.cos(angle + side) * head, by - Math.sin(angle + side) * head]], { color: o.color, width: o.width, wobble: 0.4 });
  }
}

// A group that can be turned around a point.
function turned(degrees, x, y) {
  return add("g", { transform: "rotate(" + degrees + " " + x + " " + y + ")" });
}

// ---------- The pieces the pictures are made of ----------

// Xiaohei: a small solid-black creature with white dot eyes and thin legs. arms are the points its two
// hands reach to; feet is where it stands.
function xiaohei(x, feetY, options) {
  const o = Object.assign({ size: 1, arms: [], tiptoe: false, glasses: false, lookX: 0 }, options);
  const s = o.size;
  const legLength = (o.tiptoe ? 52 : 38) * s;
  const bodyBottom = feetY - legLength;
  const cy = bodyBottom - 48 * s;
  for (const arm of o.arms) {
    const fromX = x + (arm[0] < x ? -34 : 34) * s;
    line([[fromX, cy + 4 * s], [(fromX + arm[0]) / 2 + jitter(4), (cy + arm[1]) / 2 - 10 * s], arm], { width: 3 });
    line([[arm[0] - 5, arm[1] - 3], [arm[0] + 5, arm[1] + 3]], { width: 2.6, wobble: 0.3 });
  }
  for (const side of [-1, 1]) {
    const hipX = x + side * 15 * s;
    if (o.tiptoe) {
      line([[hipX, bodyBottom - 4], [hipX + side * 3, feetY - 6]], { width: 3 });
      line([[hipX + side * 3, feetY - 6], [hipX + side * 8, feetY]], { width: 3, wobble: 0.3 });
    } else {
      line([[hipX, bodyBottom - 4], [hipX + side * 2, feetY]], { width: 3 });
      line([[hipX + side * 2, feetY], [hipX + side * 13, feetY]], { width: 3, wobble: 0.3 });
    }
  }
  const body = [];
  for (let i = 0; i < 16; i += 1) {
    const a = (i / 16) * Math.PI * 2;
    const r = 1 + jitter(0.07);
    body.push([x + Math.cos(a) * 40 * s * r, cy + Math.sin(a) * 50 * s * r]);
  }
  shape(body, { fill: INK, wobble: 0.5, step: 400 });
  const eyeY = cy - 16 * s;
  for (const eyeX of [x - 12 * s + o.lookX, x + 11 * s + o.lookX]) {
    add("circle", { cx: eyeX, cy: eyeY + jitter(1.5), r: 5.2 * s, fill: "#fff" });
  }
  if (o.glasses) {
    for (const eyeX of [x - 12 * s + o.lookX, x + 11 * s + o.lookX]) {
      oval(eyeX, eyeY, 12 * s, 12 * s, { color: "#fff", width: 2.4 });
    }
    line([[x - 1 * s + o.lookX, eyeY], [x + 0 * s + o.lookX, eyeY]], { color: "#fff", width: 2.4, wobble: 0 });
  }
}

// A clear glass jar. fill is how full of money it is, 0 to 1. lid: "on", "off" or "none".
function jar(x, y, w, h, options) {
  const o = Object.assign({ fill: 0.35, lid: "on", parent: null, notes: 3 }, options);
  const g = o.parent;
  const mouth = w * 0.76;
  const left = x, right = x + w, top = y, bottom = y + h;
  shape([[x + (w - mouth) / 2, top], [x + (w + mouth) / 2, top], [right - 4, top + h * 0.12], [right, top + h * 0.22],
    [right, bottom - 18], [right - 14, bottom], [left + 14, bottom], [left, bottom - 18], [left, top + h * 0.22], [left + 4, top + h * 0.12]], { parent: g });
  line([[right - 22, top + h * 0.3], [right - 22, top + h * 0.48]], { width: 2.4, parent: g });
  line([[right - 22, top + h * 0.55], [right - 22, top + h * 0.6]], { width: 2.4, parent: g });
  const level = bottom - (h - 20) * o.fill;
  for (let i = 0; i < o.notes; i += 1) {
    const noteY = bottom - 30 - i * ((bottom - level) / Math.max(1, o.notes));
    note(left + w * 0.18 + (i % 2) * w * 0.14 + jitter(4), noteY - 4, w * 0.5, 24, { parent: g, turn: (i % 2 ? 12 : -10) + jitter(4) });
  }
  if (o.lid === "on") {
    box(x + (w - mouth) / 2 - 8, top - 30, mouth + 16, 30, { parent: g });
    for (let k = 1; k < 6; k += 1) {
      const lx = x + (w - mouth) / 2 - 8 + ((mouth + 16) / 6) * k;
      line([[lx, top - 24], [lx, top - 6]], { width: 2.2, wobble: 0.3, parent: g });
    }
  }
}

// A banknote: a small box with a circle in the middle.
function note(x, y, w, h, options) {
  const o = Object.assign({ parent: null, turn: 0, color: INK }, options);
  const g = add("g", { transform: "rotate(" + o.turn + " " + (x + w / 2) + " " + (y + h / 2) + ")" }, o.parent);
  box(x, y, w, h, { parent: g, width: 2.6, color: o.color, wobble: 0.8 });
  oval(x + w / 2, y + h / 2, h * 0.28, h * 0.28, { parent: g, width: 2.2, color: o.color });
}

// A plain stick-figure hand and arm reaching in from the edge.
function reachingHand(fromX, fromY, toX, toY, options) {
  const o = Object.assign({ color: INK }, options);
  line([[fromX, fromY], [(fromX + toX) / 2 + jitter(10), (fromY + toY) / 2 + jitter(10)], [toX, toY]], { width: 3.2, color: o.color });
  const angle = Math.atan2(toY - fromY, toX - fromX);
  for (const spread of [-0.6, -0.2, 0.2, 0.6]) {
    line([[toX, toY], [toX + Math.cos(angle + spread) * 22, toY + Math.sin(angle + spread) * 22]], { width: 2.6, wobble: 0.4, color: o.color });
  }
}

function ground(x1, x2, y) {
  line([[x1, y], [x2, y]], { width: 2.4, wobble: 1.2, step: 60 });
}

  arrow([[752, 262], [712, 282], [690, 296]], { color: ORANGE, width: 3 });
  // the orange path toward the till, stopped by a closed gate halfway
  line([[735, 600], [800, 596], [870, 602]], { color: ORANGE, dash: "2 14", width: 4.2, wobble: 1 });
