# pytest settings for the whole repo. Owner: Emmanuel.
# --tb=short: a failing test shows only the failing lines and the error, not the list of its fixture
# values. The default long style printed TEST_DATABASE_URL, password included, on Nov 2 (AGENTS.md rule 11).
# It doesn't hide everything: a failing assert still shows the values it compares, so never write an
# assert that compares a key, token or connection string.
[pytest]
addopts = --tb=short
